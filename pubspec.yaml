name: the_great_quran
description: "The Great Quran — Real-time recitation tracker"
publish_to: 'none'
version: 1.2.0+24

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  quran_tarteel:
    path: ../quran_tarteel
  qvp_flutter:
    git:
      url: https://github.com/Iam-Muslim/quran-engine.git
      ref: fix/flutter-performance-and-parity
      path: packages/flutter/qvp_flutter
  url_launcher: ^6.3.2

  flutter_displaymode: ^0.7.0
  http: ^1.2.2
  in_app_update: ^5.0.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.1
  record: ^7.1.1
  shared_preferences: ^2.2.0
  super_sliver_list: ^0.4.1
  archive: ^4.0.0

# Dependency overrides removed (Sherpa-ONNX replaced by TajweedFormer V4).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/quran_words.json
    - assets/icon/app_icon.png
    - assets/pages.tar.xz


  fonts:
    - family: HafsSmart
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf
    - family: cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  # The 2048x2048 source is RGBA, and App Store icons must be opaque -- an alpha
  # channel is an automatic upload rejection. Flatten it for iOS only.
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
